# HRIS Barokah (repo HRISBAROKAH). Dipasang ke /etc/nginx/sites-available/hris-app oleh deploy/server-setup.sh.
# Sertifikat HTTPS memakai sertifikat Let's Encrypt yang sudah ada untuk domain ini.
server {
    server_name hris.barokahgroupindonesia.tech hris.barokahgrupindonesia.tech;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3110;
        expires 30d;
    }

    # Aplikasi kru versi web (Flutter), dikirim oleh deploy/deploy.sh
    location = /kru {
        return 301 /kru/;
    }
    location /kru/ {
        alias /var/www/hris-app/kru/;
        try_files $uri $uri/ /kru/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hris.barokahgroupindonesia.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.barokahgroupindonesia.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name hris.barokahgroupindonesia.tech hris.barokahgrupindonesia.tech;
    return 301 https://$host$request_uri;
}
